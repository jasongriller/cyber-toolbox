name: rmf release artifacts

on:
  push:
    tags:
      - "rmf-v*"

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build Lambda zips + frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build Lambda package
        run: |
          cd apps/rmf-migrator/backend
          make build   # produces build/rmf-migrator-lambda.zip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Build frontend bundle
        run: |
          cd apps/rmf-migrator/frontend
          npm ci
          npm run build
          cd dist && zip -r ../../frontend-bundle.zip . && cd ../..

      - name: Extract changelog notes for this tag
        run: |
          version="${GITHUB_REF_NAME#rmf-v}"
          awk -v start="## [$version]" '
            index($0, start) == 1 { grab = 1 }
            grab && $0 ~ /^## \[/ && index($0, start) != 1 { exit }
            grab { print }
          ' apps/rmf-migrator/CHANGELOG.md | tail -n +2 | sed '/./,$!d' > RELEASE_NOTES.md
          printf '\n**Full Changelog:** https://github.com/%s/commits/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "Release $GITHUB_REF_NAME" > RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            apps/rmf-migrator/backend/build/rmf-migrator-lambda.zip
            apps/rmf-migrator/frontend-bundle.zip
          # Notes come from CHANGELOG.md (see previous step), not GitHub's
          # auto-generated PR summary, which re-appends a "What's Changed"
          # section on every workflow run.
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
